[package]
name = "winery-nft"
description = "NFT por botella de una bodega (un contrato por bodega) sobre OpenZeppelin Stellar Contracts"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
version.workspace = true
rust-version.workspace = true

[package.metadata.stellar]
cargo_inherit = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
# Pruebas que cargan el .wasm compilado (simulación del despliegue). Requieren
# haber ejecutado antes `cargo build -p winery-nft --target wasm32v1-none --release`.
wasm-tests = []

[dependencies]
soroban-sdk = { workspace = true }
stellar-access = { workspace = true }
stellar-contract-utils = { workspace = true }
stellar-macros = { workspace = true }
stellar-tokens = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
